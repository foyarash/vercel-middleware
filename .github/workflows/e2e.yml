name: E2E tests
on:
    push:
        branches:
            - "master"
        paths:
            - "packages/**"
            - "apps/**"
            - ".github/workflows/e2e.yml"
    pull_request:
        paths:
            - "packages/**"
            - "apps/**"
            - ".github/workflows/e2e.yml"
jobs:
    start:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Enable corepack
              run: corepack enable
            - uses: actions/setup-node@v3
              with:
                  cache: "yarn"
            - name: Cache playwright dependencies
              id: cache-playwright
              uses: actions/cache@v3
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
            - name: Install dependencies
              run: yarn install
            - name: Setup packages (Build)
              run: yarn build:packages
            - name: Run linter
              run: yarn lint
            - name: Run typecheck
              run: yarn types
            - name: Check formatting
              run: yarn format:check
            - name: Run unit tests
              run: yarn test
            - name: Install playwright dependencies
              if: steps.cache-playwright.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps
            - name: Build packages
              run: yarn build:examples
            - name: Start server
              env:
                  REDIRECTIONIO_TOKEN: ${{ secrets.REDIRECTIONIO_TOKEN }}
              run: yarn start:examples &
            - name: Wait for servers
              run: |
                  for port in 3000 3001 3002 3003; do
                      url="http://localhost:$port/api/hello"
                      timeout 120 bash -c \
                          "until curl -so /dev/null $url; do sleep 1; done"
                  done
            - name: Run tests
              run: |
                  echo "Run E2E tests for Next.js 16 with Turbopack"
                  BASE_URL=http://localhost:3000 yarn test:e2e
                  echo "Run E2E tests for Next.js 16 with Webpack"
                  BASE_URL=http://localhost:3001 yarn test:e2e
                  echo "Run E2E tests for Next.js 15"
                  BASE_URL=http://localhost:3002 yarn test:e2e
                  echo "Run E2E tests for Next.js 14"
                  BASE_URL=http://localhost:3003 yarn test:e2e
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: apps/example/playwright-report/
                  retention-days: 30
